[project]
name = "carecaller-api"
version = "0.1.0"
description = "FastAPI backend for CareCaller voice agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "livekit-api>=0.7",
    "carecaller-agents @ file:///${PROJECT_ROOT}/../carecaller-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv.sources]
carecaller-agents = { path = "../carecaller-agents", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "carecaller-agents"
version = "0.1.0"
description = "LiveKit-based voice agent for TrimRX medication refill check-in calls"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # LiveKit Agents Framework
    "livekit-agents[codecs]>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-silero>=1.0",
    "livekit-plugins-openai>=1.0",
    "livekit>=1.0",

    # Configuration & Models
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Environment
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carecaller_agents"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareCaller Auto-Flagger</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Figtree', sans-serif;
    }
    :root {
      --background: oklch(1 0 0);
      --foreground: oklch(0.141 0.005 285.823);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.141 0.005 285.823);
      --primary: oklch(0.525 0.223 3.958);
      --primary-foreground: oklch(0.971 0.014 343.198);
      --secondary: oklch(0.967 0.001 286.375);
      --muted: oklch(0.967 0.001 286.375);
      --muted-foreground: oklch(0.552 0.016 285.938);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.92 0.004 286.32);
      --input: oklch(0.92 0.004 286.32);
      --chart-1: oklch(0.871 0.15 154.449);
      --chart-2: oklch(0.723 0.219 149.579);
      --chart-3: oklch(0.627 0.194 149.214);
      --chart-4: oklch(0.527 0.154 150.069);
      --chart-5: oklch(0.448 0.119 151.328);
      --radius: 0.625rem;
    }
    .dark {
      --background: oklch(0.141 0.005 285.823);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.21 0.006 285.885);
      --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.459 0.187 3.815);
      --primary-foreground: oklch(0.971 0.014 343.198);
      --secondary: oklch(0.274 0.006 286.033);
      --muted: oklch(0.274 0.006 286.033);
      --muted-foreground: oklch(0.705 0.015 286.067);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
    }
    body { background: var(--background); color: var(--foreground); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
    .badge { border-radius: calc(var(--radius) * 0.6); padding: 2px 8px; font-size: 0.75rem; font-weight: 500; }
    .bar-animate { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .fade-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-slow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .pulse-slow { animation: pulse-slow 3s ease-in-out infinite; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--secondary); }
    ::-webkit-scrollbar-thumb { background: var(--muted-foreground); border-radius: 3px; }
  </style>
  <script>
    // Theme persistence
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="min-h-screen font-sans" x-data="dashboard()" x-init="init()">

  <!-- Header -->
  <header style="border-bottom: 1px solid var(--border)" class="px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background: oklch(0.525 0.223 3.958 / 15%)">
          <!-- RiHeartPulseLine -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" style="color: var(--primary)">
            <path d="M16.5 3C19.538 3 22 5.5 22 9c0 7-7.5 11-10 12.5C9.5 20 2 16 2 9c0-3.5 2.462-6 5.5-6C9.36 3 11.048 3.695 12 4.628 12.952 3.695 14.64 3 16.5 3Zm-3.043 9.408L12 14.4l-1.457-1.992-1.2-1.637L8.2 12.3l-1.2 1.637H3.522A14.455 14.455 0 0 0 6 18.118L12 21.5l6-3.382c1.072-.768 1.835-1.476 2.478-2.218h-3.478l-1.2-1.637-1.2 1.637-1.457-1.992-.686-.937-.686.937L12 16l-1.457-1.992-1.086-1.483 1.086-1.483L12 9.05l1.457 1.992 1.086 1.483-1.086 1.483Z"/>
          </svg>
        </div>
        <h1 class="text-lg font-semibold">CareCaller <span style="color: var(--muted-foreground)" class="font-normal">Auto-Flagger</span></h1>
      </div>
      <div class="flex items-center gap-4 text-sm" style="color: var(--muted-foreground)">
        <span x-show="stats" x-text="'Model: ' + stats?.model?.toUpperCase()"></span>
        <span class="w-2 h-2 rounded-full pulse-slow inline-block" style="background: var(--chart-1)"></span>
        <!-- Theme Toggle -->
        <button @click="toggleTheme()" class="p-2 rounded-lg cursor-pointer transition-colors hover:opacity-80" style="background: var(--secondary)" title="Toggle theme">
          <svg x-show="isDark" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg x-show="!isDark" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8" x-show="stats" x-transition>

    <!-- Hero Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 fade-in">
      <div class="card p-5">
        <div class="text-sm mb-1" style="color: var(--muted-foreground)">Total Calls</div>
        <div class="text-2xl font-bold" x-text="stats.total_calls"></div>
      </div>
      <div class="card p-5" style="box-shadow: 0 0 30px oklch(0.704 0.191 22.216 / 15%)">
        <div class="text-sm mb-1" style="color: var(--muted-foreground)">Flagged</div>
        <div class="text-2xl font-bold" style="color: var(--destructive)" x-text="stats.flagged_calls"></div>
        <div class="text-xs mt-1" style="color: var(--muted-foreground)" x-text="stats.flagged_pct + '%'"></div>
      </div>
      <div class="card p-5" style="box-shadow: 0 0 30px oklch(0.871 0.15 154.449 / 15%)">
        <div class="text-sm mb-1" style="color: var(--muted-foreground)">Val F1</div>
        <div class="text-2xl font-bold" style="color: var(--chart-1)" x-text="stats.val_metrics?.f1"></div>
      </div>
      <div class="card p-5">
        <div class="text-sm mb-1" style="color: var(--muted-foreground)">Precision</div>
        <div class="text-2xl font-bold" x-text="stats.val_metrics?.precision"></div>
      </div>
      <div class="card p-5">
        <div class="text-sm mb-1" style="color: var(--muted-foreground)">Recall</div>
        <div class="text-2xl font-bold" x-text="stats.val_metrics?.recall"></div>
      </div>
      <div class="card p-5">
        <div class="text-sm mb-1" style="color: var(--muted-foreground)">Features</div>
        <div class="text-2xl font-bold" x-text="stats.feature_count"></div>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 gap-6">

      <!-- Category Breakdown -->
      <div class="card p-6 fade-in">
        <h2 class="text-sm font-semibold mb-4 uppercase tracking-wider" style="color: var(--muted-foreground)">Issue Categories</h2>
        <div class="space-y-3">
          <template x-for="[cat, count] in Object.entries(stats.category_breakdown || {})" :key="cat">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span x-text="cat"></span>
                <span style="color: var(--muted-foreground)" x-text="count"></span>
              </div>
              <div class="h-2 rounded-full overflow-hidden" style="background: var(--secondary)">
                <div class="h-full rounded-full bar-animate"
                  :style="'width:' + (count / stats.flagged_calls * 100) + '%; background:' + (cat === 'audio_issue' ? 'var(--chart-4)' : cat === 'elevenlabs' ? 'var(--primary)' : 'var(--chart-2)')"></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Outcome Breakdown -->
      <div class="card p-6 fade-in">
        <h2 class="text-sm font-semibold mb-4 uppercase tracking-wider" style="color: var(--muted-foreground)">Outcomes</h2>
        <div class="space-y-2">
          <template x-for="[outcome, data] in Object.entries(stats.outcome_breakdown || {}).sort((a,b) => b[1].flagged - a[1].flagged)" :key="outcome">
            <div class="flex items-center gap-3 text-sm">
              <span class="w-28 truncate" style="color: var(--muted-foreground)" x-text="outcome"></span>
              <div class="flex-1 h-4 rounded overflow-hidden relative" style="background: var(--secondary)">
                <div class="h-full rounded bar-animate" style="background: var(--muted)" :style="'width:' + (data.total / stats.total_calls * 100) + '%'"></div>
                <div class="h-full rounded absolute top-0 left-0 bar-animate" style="background: var(--destructive); opacity: 0.7" :style="'width:' + (data.flagged / stats.total_calls * 100) + '%'"></div>
              </div>
              <span class="w-16 text-right" style="color: var(--muted-foreground)" x-text="data.flagged + '/' + data.total"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Confidence Distribution -->
      <div class="card p-6 fade-in">
        <h2 class="text-sm font-semibold mb-4 uppercase tracking-wider" style="color: var(--muted-foreground)">Confidence Distribution</h2>
        <div class="flex items-end gap-1 h-32">
          <template x-for="bin in histogram" :key="bin.label">
            <div class="flex-1 flex flex-col items-center gap-1">
              <div class="w-full rounded-t transition-all duration-500"
                :style="'height:' + (bin.count / maxBin * 100) + '%; background:' + (bin.midpoint >= stats.threshold ? 'var(--destructive)' : 'var(--chart-1)') + '; opacity: 0.6'"></div>
            </div>
          </template>
        </div>
        <div class="flex justify-between text-xs mt-2" style="color: var(--muted-foreground)">
          <span>0.0</span>
          <span style="color: var(--primary)">threshold: <span x-text="stats.threshold"></span></span>
          <span>1.0</span>
        </div>
      </div>
    </div>

    <!-- Feature Importance -->
    <div class="card p-6 fade-in">
      <h2 class="text-sm font-semibold mb-4 uppercase tracking-wider" style="color: var(--muted-foreground)">Top Feature Importance</h2>
      <div class="grid md:grid-cols-2 gap-x-8 gap-y-2">
        <template x-for="feat in importance.slice(0, 20)" :key="feat.feature">
          <div class="flex items-center gap-3">
            <span class="text-xs w-48 truncate" style="color: var(--muted-foreground)" x-text="feat.feature"></span>
            <div class="flex-1 h-2 rounded-full overflow-hidden" style="background: var(--secondary)">
              <div class="h-full rounded-full bar-animate" style="background: linear-gradient(90deg, var(--chart-1), var(--chart-2))"
                :style="'width:' + (feat.importance / importance[0].importance * 100) + '%'"></div>
            </div>
            <span class="text-xs w-12 text-right" style="color: var(--muted-foreground)" x-text="feat.importance.toFixed(3)"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Calls Table -->
    <div class="card p-6 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider" style="color: var(--muted-foreground)">Calls</h2>
        <div class="flex gap-2">
          <template x-for="s in ['all', 'train', 'val', 'test']" :key="s">
            <button @click="filterSplit = s; loadCalls()"
              :style="filterSplit === s ? 'background: var(--input); color: var(--foreground)' : 'color: var(--muted-foreground)'"
              class="px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer hover:opacity-80" x-text="s"></button>
          </template>
          <button @click="flaggedOnly = !flaggedOnly; loadCalls()"
            :style="flaggedOnly ? 'background: oklch(0.704 0.191 22.216 / 20%); color: var(--destructive)' : 'color: var(--muted-foreground)'"
            class="px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer hover:opacity-80">flagged only</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-xs uppercase" style="color: var(--muted-foreground); border-bottom: 1px solid var(--border)">
              <th class="text-left py-2 px-3">Call ID</th>
              <th class="text-left py-2 px-3">Outcome</th>
              <th class="text-right py-2 px-3">Probability</th>
              <th class="text-center py-2 px-3">Flagged</th>
              <th class="text-left py-2 px-3">Category</th>
              <th class="text-right py-2 px-3">Duration</th>
              <th class="text-right py-2 px-3">Completeness</th>
              <th class="text-center py-2 px-3">Split</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="call in calls.slice(0, 100)" :key="call.call_id">
              <tr class="cursor-pointer transition hover:opacity-80"
                  style="border-bottom: 1px solid var(--border)"
                  @click="window.location.href = '/call/' + call.call_id">
                <td class="py-2 px-3 font-mono text-xs" x-text="call.call_id.slice(0, 12) + '...'"></td>
                <td class="py-2 px-3">
                  <span class="badge"
                    :style="{
                      'completed': 'background: oklch(0.871 0.15 154.449 / 15%); color: var(--chart-1)',
                      'incomplete': 'background: oklch(0.8 0.15 80 / 15%); color: oklch(0.8 0.15 80)',
                      'opted_out': 'background: var(--secondary); color: var(--muted-foreground)',
                      'escalated': 'background: oklch(0.704 0.191 22.216 / 15%); color: var(--destructive)',
                      'wrong_number': 'background: oklch(0.459 0.187 3.815 / 15%); color: var(--primary)',
                      'voicemail': 'background: var(--secondary); color: var(--muted-foreground)',
                      'scheduled': 'background: var(--secondary); color: var(--muted-foreground)',
                    }[call.outcome]" x-text="call.outcome"></span>
                </td>
                <td class="py-2 px-3 text-right font-mono">
                  <span :style="call.probability >= stats.threshold ? 'color: var(--destructive)' : 'color: var(--muted-foreground)'"
                    x-text="(call.probability * 100).toFixed(1) + '%'"></span>
                </td>
                <td class="py-2 px-3 text-center">
                  <span x-show="call.predicted_ticket" style="color: var(--destructive)">&#9679;</span>
                  <span x-show="!call.predicted_ticket" style="color: var(--muted)">&#9675;</span>
                </td>
                <td class="py-2 px-3 text-xs"
                  :style="{
                    'audio_issue': 'color: var(--chart-4)',
                    'elevenlabs': 'color: var(--primary)',
                    'openai': 'color: var(--chart-2)',
                  }[call.predicted_category] || 'color: var(--muted-foreground)'" x-text="call.predicted_category || '—'"></td>
                <td class="py-2 px-3 text-right" style="color: var(--muted-foreground)" x-text="call.call_duration + 's'"></td>
                <td class="py-2 px-3 text-right">
                  <span :style="call.response_completeness < 0.5 ? 'color: oklch(0.8 0.15 80)' : 'color: var(--muted-foreground)'"
                    x-text="(call.response_completeness * 100).toFixed(0) + '%'"></span>
                </td>
                <td class="py-2 px-3 text-center text-xs" style="color: var(--muted-foreground)" x-text="call.split"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <div class="text-xs mt-3" style="color: var(--muted-foreground)" x-text="'Showing ' + Math.min(calls.length, 100) + ' of ' + calls.length + ' calls'"></div>
    </div>

  </main>

  <!-- Loading -->
  <div x-show="!stats" class="flex items-center justify-center min-h-screen">
    <div class="text-center">
      <div class="w-8 h-8 border-2 border-t-transparent rounded-full animate-spin mx-auto mb-4" style="border-color: var(--chart-1); border-top-color: transparent"></div>
      <p style="color: var(--muted-foreground)">Loading dashboard...</p>
    </div>
  </div>

  <script>
    function dashboard() {
      return {
        stats: null,
        calls: [],
        importance: [],
        histogram: [],
        maxBin: 1,
        filterSplit: 'all',
        flaggedOnly: false,
        isDark: document.documentElement.classList.contains('dark'),

        toggleTheme() {
          this.isDark = !this.isDark;
          document.documentElement.classList.toggle('dark', this.isDark);
          localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
        },

        async init() {
          const [statsRes, callsRes, impRes] = await Promise.all([
            fetch('/api/stats').then(r => r.json()),
            fetch('/api/calls').then(r => r.json()),
            fetch('/api/importance').then(r => r.json()),
          ]);
          this.stats = statsRes;
          this.calls = callsRes;
          this.importance = impRes;
          this.buildHistogram(callsRes);
        },

        async loadCalls() {
          const params = new URLSearchParams();
          if (this.filterSplit !== 'all') params.set('split', this.filterSplit);
          if (this.flaggedOnly) params.set('flagged_only', 'true');
          this.calls = await fetch('/api/calls?' + params).then(r => r.json());
        },

        buildHistogram(calls) {
          const bins = Array.from({length: 20}, (_, i) => ({
            label: (i * 5) + '-' + ((i + 1) * 5) + '%',
            midpoint: (i * 5 + 2.5) / 100,
            count: 0,
          }));
          for (const c of calls) {
            const idx = Math.min(Math.floor(c.probability * 20), 19);
            bins[idx].count++;
          }
          this.maxBin = Math.max(...bins.map(b => b.count), 1);
          this.histogram = bins;
        },
      };
    }
  </script>
</body>
</html>
